# =============================================================================
# INTIWATANA - Perfil PRODUCCION
# =============================================================================
# PRINCIPIOS:
#   - NINGUN secreto se escribe en este archivo: todo llega por variables de
#     entorno (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET,
#     CORS_ALLOWED_ORIGINS).
#   - Si falta una variable obligatoria la aplicacion NO arranca (fail-fast).
#   - El esquema lo construye Flyway; Hibernate solo VALIDA el modelo.
#   - No se exponen stack traces ni detalles de salud al cliente.
#   - DataInitializer esta deshabilitado en este perfil (ver @Profile).
# =============================================================================

spring:
  datasource:
    # Sin valores por defecto: obligatorias.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  level:
    root: WARN
    com.transporte: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
