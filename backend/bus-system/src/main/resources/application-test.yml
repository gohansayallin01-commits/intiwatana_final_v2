# =============================================================================
# INTIWATANA - Perfil PRUEBAS
# =============================================================================
# Pensado para una base de datos de pruebas independiente o efimera.
# Flyway CONSTRUYE el esquema desde cero y Hibernate solo VALIDA.
# Todas las credenciales son OBLIGATORIAS por variable de entorno.
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 6
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.transporte: INFO